<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipstream: upload</title>
  <script>
    (function () {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('clipstream.theme') === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/upload.js"></script>
</head>
<body>
  <div class="upload-page">
    <header class="topbar">
      <a class="brand" href="feed.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l10-6.5z"/></svg>
        </span>
        Clipstream
      </a>
      <div style="display:flex;gap:10px">
        <button type="button" class="btn" data-theme-toggle>
          <svg data-icon-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg data-icon-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span data-theme-label>Dark mode</span>
        </button>
      </div>
    </header>

    <main class="upload-card">
      <h1>Upload a video</h1>

      <form id="upload-form" novalidate>
        <label class="dropzone" for="file">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
          <strong id="file-name">Choose a video file</strong>
          <p>MP4, MOV or WebM, up to 500 MB. Converted to a standard format after upload.</p>
          <input id="file" name="file" type="file" accept="video/*" style="position:absolute;width:1px;height:1px;opacity:0" required>
        </label>

        <div class="field" style="margin-top:20px">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" maxlength="100" placeholder="Give your video a title" required>
        </div>

        <div class="field" style="margin-top:16px">
          <label for="caption">Caption</label>
          <textarea id="caption" name="caption" maxlength="300" placeholder="Say something about it"></textarea>
        </div>

        <div style="margin-top:20px;display:flex;flex-direction:column;gap:12px">
          <div class="progress" aria-hidden="true"><span id="progress-bar" style="width:0"></span></div>
          <p class="upload-status" id="upload-status" role="status" aria-live="polite"></p>
          <p class="form-error" id="upload-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary" id="upload-submit">Upload</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
