<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipstream: feed</title>
  <script>
    (function () {
      try {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('clipstream.theme') === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/feed.js"></script>
</head>
<body>
  <div class="app">

    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="feed.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l10-6.5z"/></svg>
        </span>
        <span class="nav-label">Clipstream</span>
      </a>

      <div class="nav">
        <a href="feed.html" aria-current="page">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
          <span class="nav-label">For You</span>
        </a>
      </div>

      <a class="btn btn-primary btn-upload" href="upload.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-upload-label">Upload video</span>
      </a>

      <div class="sidebar-footer">
        <button type="button" class="btn" data-theme-toggle>
          <svg data-icon-sun width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg data-icon-moon width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span data-theme-label>Dark mode</span>
        </button>
        <div class="user-row">
          <span class="avatar" id="user-avatar" style="background:#3b5bdb" aria-hidden="true">--</span>
          <div style="flex-grow:1;display:flex;flex-direction:column;min-width:0">
            <span class="name" id="user-name">Guest</span>
            <span class="handle" id="user-handle">@guest</span>
          </div>
          <button type="button" class="btn-icon" id="logout" aria-label="Log out" style="background:transparent;width:44px;height:44px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          </button>
        </div>
      </div>
    </nav>

    <main class="main">
      <div class="player-row">
        <div class="nav-arrows">
          <button type="button" class="btn-icon" id="prev" aria-label="Previous video">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
          </button>
        </div>

        <article class="player" id="player" aria-label="Video player">
          <div class="player-centre">
            <div class="play-badge" aria-hidden="true">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l10-6.5z"/></svg>
            </div>
            <span style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75" id="player-note">Video</span>
          </div>
          <div class="captions" id="captions" hidden>
            <span class="captions-label">Captions</span>
            <div id="captions-text"></div>
          </div>
          <div class="player-meta">
            <span class="status-pill" id="status-pill">Ready</span>
            <span id="player-title" style="font-size:16px;font-weight:700"></span>
            <span id="player-sound" style="font-size:13px;opacity:.9"></span>
          </div>
        </article>

        <div class="rail">
          <div class="rail-item">
            <button type="button" class="btn-icon" id="like" aria-label="Like" aria-pressed="false">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" id="heart"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.7 8 3.8 4.5 7.3 4.5c2 0 3.5 1.1 4.7 2.7 1.2-1.6 2.7-2.7 4.7-2.7 3.5 0 5.6 3.5 4.5 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>
            </button>
            <span id="like-count">0</span>
          </div>
          <div class="rail-item">
            <button type="button" class="btn-icon" id="comments-jump" aria-label="Jump to comments">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>
            </button>
            <span id="comment-count">0</span>
          </div>
          <div class="rail-item">
            <button type="button" class="btn-icon" id="captions-toggle" aria-label="Show captions" aria-pressed="false">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 10.5a2 2 0 0 0-2 1.5 2 2 0 0 0 2 2M13 10.5a2 2 0 0 0-2 1.5 2 2 0 0 0 2 2"/></svg>
            </button>
            <span>CC</span>
          </div>
        </div>

        <div class="nav-arrows">
          <button type="button" class="btn-icon" id="next" aria-label="Next video">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <span class="counter" id="position"></span>
        </div>
      </div>
    </main>

    <aside class="panel" aria-label="Video details and comments">
      <section class="creator">
        <div class="creator-head">
          <span class="avatar" id="creator-avatar" aria-hidden="true"></span>
          <div style="display:flex;flex-direction:column">
            <span class="name" id="creator-name"></span>
            <span class="handle" id="creator-handle"></span>
          </div>
        </div>
        <p id="creator-caption"></p>
        <div class="tags" id="creator-tags"></div>

        <div class="sentiment-summary" aria-live="polite">
          <span class="label" id="sentiment-label">Comment mood</span>
          <div class="sentiment-bar" id="sentiment-bar" role="img" aria-label="Comment mood breakdown">
            <span class="bar-positive" style="width:0"></span>
            <span class="bar-neutral" style="width:0"></span>
            <span class="bar-negative" style="width:0"></span>
          </div>
          <div class="sentiment-legend" id="sentiment-legend"></div>
        </div>
      </section>

      <div class="comments-head">
        <h2>Comments</h2>
        <span id="comments-total"></span>
      </div>

      <div class="comment-list" id="comment-list" tabindex="0" aria-label="Comments"></div>

      <form class="comment-form" id="comment-form">
        <label for="comment-input" class="sr-only">Add a comment</label>
        <input id="comment-input" type="text" placeholder="Add a comment…" maxlength="300" autocomplete="off">
        <button type="submit" id="comment-submit">Post</button>
      </form>
    </aside>
  </div>
</body>
</html>
